version: 2

# This node runs unattended in a vehicle and has exactly two runtime
# dependencies, so the risk here is not churn -- it is a dependency quietly
# ageing out of support while nobody is looking at it.  Weekly is frequent
# enough to notice that and infrequent enough to stay readable.

updates:
  # Reads the dependencies and the `dev` extra declared in pyproject.toml.
  #
  # Expect this one to be quiet, and know why before reading its silence as
  # "everything is current".  Every requirement here is an open lower bound
  # (`Pillow>=9.2`, `pyserial>=3.5`, `pytest>=8`) and there is no lock file, so
  # a new release already satisfies the constraint and dependabot has nothing
  # to raise a pull request about.  It starts reporting the moment a pin, a
  # ceiling or a lock file exists -- which is also what pinning the CI ruff
  # version in `[project.optional-dependencies] dev` would create, instead of
  # spelling it inline in the workflow where dependabot cannot see it.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Covers every `uses:` in .github/workflows.  Those are pinned to major
  # version tags, so this mostly surfaces a major bump, which is precisely the
  # one worth reading rather than merging on sight.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
