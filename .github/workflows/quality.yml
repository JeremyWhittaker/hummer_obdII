name: quality

# Style and secret hygiene, kept separate from `tests.yml` so that a lint
# opinion can never be confused with a failing test.  Tests decide whether the
# code is correct; nothing in this file is allowed to make that call.

on:
  push:
  pull_request:
  # gitleaks-action only scans the whole history when the run was *not* a push
  # or a pull request: for those two it passes `--log-opts` limiting the scan
  # to the pushed commit range.  A manual run is therefore the only trigger
  # here that answers "is there a secret anywhere in this repository's past?".
  # Run it once by hand after enabling this workflow.  A weekly `schedule:`
  # would automate that and is a deliberate open decision, not an oversight.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Pinned rather than floating, so that a change in what this job reports
      # is always traceable to a commit.  With a range, a new rule in a
      # released version changes CI output on a branch nobody touched, and the
      # first question -- "did my change cause this?" -- has no cheap answer.
      # Bump it deliberately; dependabot cannot see a version spelled inline
      # here, which is the trade for the pin.
      - name: Install ruff
        run: python -m pip install "ruff==0.15.12"

      # Both ruff steps are advisory, and the two reasons differ.
      #
      # `ruff check` passes on the tree as of the commit that removed the last
      # unused imports, so this step being non-blocking is now a choice rather
      # than a necessity: promoting it costs one line and buys a real gate.
      # It is left advisory only so that a single lint opinion cannot block a
      # merge without someone deciding it should.
      #
      # `ruff format --check` reports 34 of 36 files, so blocking *that* today
      # would fail on its first run and the only way to green it would be a
      # mass reformat mixed into an unrelated change.  That promotion starts
      # with a formatting commit of its own.
      #
      # Re-measure before changing either line; do not trust this comment.
      - name: Lint
        continue-on-error: true
        run: ruff check --output-format=github src tests

      - name: Format
        continue-on-error: true
        run: ruff format --check --diff src tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Required, but it does not by itself buy a history scan.  On a push
          # or a pull request gitleaks-action scans
          # `<base>^..<head>` only, and resolving that range at all needs the
          # full clone -- a shallow one makes the step fail rather than scan
          # less.  The whole-history scan, which is the one that matters
          # because a secret is only removed by rewriting history, happens on
          # the `workflow_dispatch` trigger declared above.
          fetch-depth: 0

      # Blocking, unlike the lint steps above.  This repository's own rules
      # forbid committing credentials, network identifiers, an adapter MAC or
      # an unmasked VIN, and a scan that reports a finding without stopping the
      # build is a scan nobody reads.  If this ever fires, the finding is
      # either real or needs a `.gitleaksignore` entry carrying a written
      # justification -- never a silenced step.
      #
      # Unverified locally: gitleaks is not installed on the machine this was
      # written on, so the first CI run is also the first time this step has
      # ever executed.  `git ls-files` matches nothing credential-shaped and
      # `hummer_pi_sd.env` has never been tracked, so a clean result is
      # expected -- expected, not proven.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A gitleaks report embeds the matched secret.  Workflow artifacts on
          # a public repository are downloadable by anyone, so publishing one
          # would turn a detection into a second disclosure.  The job log
          # already names the file, line and rule, which is what a fix needs.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          # PR comments would need `pull-requests: write`, and this workflow is
          # not worth widening the token for.
          GITLEAKS_ENABLE_COMMENTS: false
          # Note for a future move: gitleaks-action is free for repositories on
          # a personal account and requires GITLEAKS_LICENSE for an
          # organisation.  Transferring this repository to an org will break
          # this step until that key is set.
