<text x="165.0" y="126" text-anchor="middle" class="d">24 Ultium modules, 2 × 12</text>
<text x="165.0" y="140" text-anchor="middle" class="d">96 cells in series (measured here)</text>
<text x="165.0" y="154" text-anchor="middle" class="d">2,818 lb; stamped-steel case</text>
<text x="165.0" y="200" text-anchor="middle" class="s">GM rescue sheet · Munro/InsideEVs · this project</text>
