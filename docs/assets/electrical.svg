<text x="24" y="34" class="t" font-size="20" font-weight="700">GMC Hummer EV Pickup Edition 1 — electrical architecture, as sourced</text>
<text x="24" y="54" class="d">Orange: high voltage (~400 V; two 12-module stacks). Yellow: 12 V. Blue dashed: diagnostic bus to the DLC. Every box names its source; boxes with dashed borders exist per a source but have no published location.</text>
<rect x="40" y="90" width="250" height="118" rx="6" fill="#1a1f21" stroke="#e07a1f" stroke-width="1.6"/>
