[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hummer-obd-node"
version = "0.1.0"
description = "Fail-closed, read-only OBD-II telemetry for a Raspberry Pi vehicle node"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Jeremy Whittaker"}]
dependencies = [
    "Pillow>=9.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hummer-obd-probe = "hummer_obd.probe:main"
hummer-obd-collector = "hummer_obd.collector:main"
hummer-obd-display = "hummer_obd.display.status:main"
hummer-obd-recover = "hummer_obd.btdiscover:main"
hummer-obd-capabilities = "hummer_obd.capabilities:main"
hummer-obd-export = "hummer_obd.export:main"
hummer-obd-voltage = "hummer_obd.voltage:main"
hummer-obd-enhanced = "hummer_obd.enhanced:main"
hummer-obd-drive = "hummer_obd.drive:main"
hummer-obd-analyze = "hummer_obd.analyze:main"
hummer-obd-live = "hummer_obd.live:main"
hummer-obd-discover = "hummer_obd.discover:main"
hummer-obd-decode = "hummer_obd.decode_fields:main"
hummer-obd-passive = "hummer_obd.monitor:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
