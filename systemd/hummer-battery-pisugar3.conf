# Installed by scripts/install-pisugar3-power.sh after identifying the board.
[Service]
User=root
Group=root
WorkingDirectory=/usr/local/lib/hummer-power
EnvironmentFile=
ExecStartPre=/usr/bin/python3 -I /usr/local/lib/hummer-power/pisugar3_power.py ensure-restore
ExecStart=
ExecStart=/usr/bin/python3 -I -u /usr/local/lib/hummer-power/pisugar3_power.py watch --reserve-percent 10 --voltage-floor 3.40 --interval-s 30 --consecutive 3
ProtectHome=true
ProtectSystem=strict
ReadWritePaths=
ReadWritePaths=/run
TimeoutStopSec=15
